// The submitter's node: the synchronizer (a sequencer and a mediator) and one participant, in one process. The silent participant runs in another (silent.conf),
// so that it can be stopped as a participant that does not answer is.
canton {
  sequencers.sequencer1 {
    storage.type = memory
    public-api { address = "127.0.0.1", port = 5001 }
    admin-api { address = "127.0.0.1", port = 5002 }
    sequencer.type = BFT
  }
  mediators.mediator1 {
    storage.type = memory
    admin-api { address = "127.0.0.1", port = 5202 }
  }
  participants.submitter {
    storage.type = memory
    admin-api { address = "127.0.0.1", port = 5022 }
    ledger-api { address = "127.0.0.1", port = 5021 }
    http-ledger-api { address = "127.0.0.1", port = 7576 }
  }
}
