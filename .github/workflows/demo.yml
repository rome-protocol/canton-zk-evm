name: demo

on:
  pull_request:
    paths: [".github/actions/pinned-images/**", "demo/**", "gateway/**", "tests/demo_*", "tests/test_demo_*", "network/**", "daml/**", "builder/**", "sidecar/**", "verifier/**", "mpt/**", "explorer/**", "PINS", "tests/FOUNDRY", ".github/workflows/demo.yml"]
  push:
    branches: [main]
    paths: [".github/actions/pinned-images/**", "demo/**", "gateway/**", "tests/demo_*", "tests/test_demo_*", "network/**", "daml/**", "builder/**", "sidecar/**", "verifier/**", "mpt/**", "explorer/**", "PINS", "tests/FOUNDRY", ".github/workflows/demo.yml"]

permissions:
  contents: read

jobs:
  # No Docker, Canton or GPU: the demo's EVM side against a fake reth, the tamper switch, the genesis override, the recorded results.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: shellcheck demo/*.sh demo/tests/*.sh tests/demo_*.sh explorer/test/l5/l5.sh
      - run: tests/demo_static.sh
      - run: tests/demo_explorer_static.sh
      - name: Install the demo's packages, by hash
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r demo/requirements.txt
      - name: demo/live.sh against stand-ins for evm.py and canton.py
        run: demo/tests/live_test.sh
      - name: The EVM side (a fake reth) and the sidecar stand-in
        run: |
          "$RUNNER_TEMP/venv/bin/python" -W error::ResourceWarning -m unittest discover -s demo/tests -v
          python3 -m unittest discover -s tests -p 'test_demo_sidecar.py' -v
          python3 -W error::ResourceWarning -m unittest discover -s tests -p 'test_demo_call_log.py' -v
          python3 -m unittest discover -s tests -p 'test_demo_nightly_l3.py' -v
          python3 -m unittest discover -s tests -p 'test_demo_nightly_l5_probe.py' -v

  # demo/TKA.bin is what the pinned solc makes of demo/TKA.sol.
  token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: SOLC_IMAGE
      - run: demo/build-token.sh --check

  # Everything but the proof: real reth, real Canton and Daml package, real token standard, real builder, the real sidecar for
  # the legs check; a stand-in prover and a stand-in for the sidecar's proof check (tests/demo_rehearsal.sh says what is real).
  # The explorer's image is built and run beside the chain, and checked against it.
  rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: RETH_IMAGE BUSYBOX_IMAGE EXPLORER_NODE_IMAGE EXPLORER_RUST_IMAGE POSTGRES_IMAGE SOLC_IMAGE SOLC_SANDBOX_IMAGE
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - run: tests/demo_rehearsal.sh

  # A chain that runs is upgraded to the next version of the Daml package, its gas cap is raised, and the block gas limit goes over the old cap,
  # on the real network: the DAR of the tag v0.2.0 and the current source (0.3.0), the package put on each participant in the steps of
  # network/external/setup.py --package-step (check, upload not vetted, vet with a dry run first), the builder pinned to 0.3.0, the gas cap raised in
  # the steps of --gas-cap-step (dry run, propose, accept), the program keys replaced and put back in the steps of --program-step, a block whose header hex has a capital letter refused, the builder's
  # --target-gas-limit ramp with committed blocks over 30,000,000, the builder pinned back to 0.2.0 (the downgrade), and forward again. Real reth (launch.sh, discovery off),
  # Canton, builder and sidecar for the legs; the proof is a stand-in (tests/demo_package_upgrade.sh).
  package-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: RETH_IMAGE BUSYBOX_IMAGE
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - run: tests/demo_package_upgrade.sh
