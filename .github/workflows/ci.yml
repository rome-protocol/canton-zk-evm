name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Scan the history for secrets
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xz -f gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --log-opts=HEAD

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Lint every shell script
        run: shellcheck network/*.sh network/reth/*.sh network/canton/*.sh network/external/*.sh tests/*.sh .github/actions/pinned-images/*.sh

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Pins and genesis agree
        run: tests/static.sh

  load-fee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: The load kit never sends a tip above the max fee
        run: node --test load/mixed/scripts/fee.test.mjs
      - name: The load kit tells expected reverts from unexpected ones
        run: node --test load/mixed/scripts/classify.test.mjs
      - name: The load kit keeps its wallets funded and sets a swap's minimum from a fresh quote
        run: node --test load/mixed/scripts/refill.test.mjs
      - name: The load kit's RPC budget is first come, first served, so the refill is never starved
        run: node --test load/mixed/scripts/limiter.test.mjs

  refuses-missing-flag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: launch.sh refuses a command line without a discovery flag
        run: tests/refuses_missing_flag.sh

  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: RETH_IMAGE BUSYBOX_IMAGE
      - name: Start the pinned reth, check it, stop it
        run: tests/discovery.sh

  udp-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: BUSYBOX_IMAGE
      - name: The UDP check fails on a container with a UDP listener and passes on one without
        run: tests/udp_control.sh

  pinned-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: The pinned-images script retries the pull with a growing wait, checks the digest, and its static check bites (fake docker)
        run: tests/pinned_images.sh
