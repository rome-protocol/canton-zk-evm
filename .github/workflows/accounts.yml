name: accounts

on:
  pull_request:
    paths: ["apps/accounts/**", "network/canton/**", "network/external/**", "daml/**", "tests/fake_sidecar.py", "tests/external_bootstrap.canton", "PINS", ".github/workflows/accounts.yml"]
  push:
    branches: [main]
    paths: ["apps/accounts/**", "network/canton/**", "network/external/**", "daml/**", "tests/fake_sidecar.py", "tests/external_bootstrap.canton", "PINS", ".github/workflows/accounts.yml"]

permissions:
  contents: read

jobs:
  # A fake Canton JSON Ledger API only. The service uses the standard library alone.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Python 3.12
        run: python3 --version | grep -q '^Python 3\.12\.'
      - name: Run the tests
        run: python3 -m unittest discover -s apps/accounts/tests -p 'test_*.py' -v

  # The service on the real, pinned Canton (the protocol version PINS names): an external party from an Ed25519 key made in the test, a WithdrawalAcceptance
  # of the real Daml package created for it with that key's signature, and its holdings.
  canton:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: The accounts service on Canton
        run: apps/accounts/tests/integration.sh
