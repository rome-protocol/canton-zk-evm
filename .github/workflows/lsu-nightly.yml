name: lsu-nightly

# A logical synchronizer upgrade under a running chain, on the real local network (tests/canton_lsu.sh says what is real and what is checked): the
# synchronizer moves from protocol version 36 to 37 while the builder makes blocks, with a block's confirmation held across the upgrade time. It runs
# on a schedule and by hand, never on every pull request: a run takes about 10 minutes. The one exception is a pull request that changes this test's
# own files (the paths below). A workflow can be dispatched by name only once it is on the default branch, so the first run of a new nightly is that.
on:
  pull_request:
    paths: [".github/workflows/lsu-nightly.yml", ".github/actions/pinned-images/**", "tests/canton_lsu.sh", "tests/lsu_record.py", "tests/demo_sidecar.py", "network/canton/lsu*", "PINS"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One at a time: two on one repository would fight for the runners' disk and the registry's pull limit.
concurrency:
  group: lsu-nightly-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # auto: the participants move to the successor by themselves once its sequencer is announced. manual: each is moved by perform_manual_lsu.
  network:
    name: network (${{ matrix.switch }} switch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        switch: [auto, manual]
    env:
      LSU_SWITCH: ${{ matrix.switch }}
      LSU_HOLD_SECONDS: "8"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: RETH_IMAGE BUSYBOX_IMAGE
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: The upgrade under a running chain
        run: LSU_OUT="$RUNNER_TEMP/lsu" tests/canton_lsu.sh
      - name: Summary
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/lsu/record.txt" ]; then
            { printf '### Protocol version 36 to 37, %s switch\n\n```\n' "$LSU_SWITCH"; cat "$RUNNER_TEMP/lsu/record.txt"; printf '```\n'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the record, the journal and the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lsu-results-${{ matrix.switch }}
          path: ${{ runner.temp }}/lsu
          if-no-files-found: warn
