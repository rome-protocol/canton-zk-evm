name: gateway

on:
  pull_request:
    paths: ["gateway/**", "network/**", "PINS", "builder/keccak.py", "prover/make-block.py", "demo/TKA.bin", "demo/requirements.txt", "tests/static.sh", ".github/workflows/gateway.yml"]
  push:
    branches: [main]
    paths: ["gateway/**", "network/**", "PINS", "builder/keccak.py", "prover/make-block.py", "demo/TKA.bin", "demo/requirements.txt", "tests/static.sh", ".github/workflows/gateway.yml"]

permissions:
  contents: read

jobs:
  # gateway/Gateway.bin-runtime is what the pinned solc makes of gateway/Gateway.sol.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: gateway/build.sh --check

  # The contract on a real reth, started only through network/reth/launch.sh (peer discovery off) and checked by network/reth/check.sh:
  # every function, every refusal, and each block's leg hash worked out in Python and compared with the storage proof.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install the packages, by hash
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r demo/requirements.txt
      - name: Test the gateway on a real reth
        run: PYTHON="$RUNNER_TEMP/venv/bin/python" gateway/tests/run.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: shellcheck gateway/*.sh gateway/tests/*.sh
