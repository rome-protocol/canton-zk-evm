name: explorer

on:
  pull_request:
    paths: [".github/actions/pinned-images/**", "explorer/**", "network/canton/**", "tests/fake_sidecar.py", "sidecar/**", "verifier/**", "mpt/**", "prover/fixtures/**", "rust-toolchain.toml", "PINS", ".github/workflows/explorer.yml"]
  push:
    branches: [main]
    paths: [".github/actions/pinned-images/**", "explorer/**", "network/canton/**", "tests/fake_sidecar.py", "sidecar/**", "verifier/**", "mpt/**", "prover/fixtures/**", "rust-toolchain.toml", "PINS", ".github/workflows/explorer.yml"]

permissions:
  contents: read

jobs:
  # Fakes only: a fake reth and a fake Ledger API. No Docker network, Canton or GPU. The tests run in the pinned Node image, and the pages must build.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: EXPLORER_NODE_IMAGE
      - name: Type-check and run the tests, from the lockfile
        run: |
          set -a; . ./PINS; set +a
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo" -w /repo/explorer "$EXPLORER_NODE_IMAGE" \
            sh -c "npm ci --ignore-scripts && npm run typecheck && npm test && npm run build"

  # The verifier's sandbox, for real: a compile runs in a container of the pinned image (BUSYBOX_IMAGE) with no network, a read-only filesystem,
  # a memory limit and a time limit, and the tests check each of them. The tests run in the pinned Node image, which talks to the runner's own
  # Docker through its socket (the Docker program is the static build that PINS pins, checked against its SHA-256 and mounted in). The compilers the tests make sit in a folder that the container
  # and the daemon see at the same path. EXPLORER_TEST_REQUIRE_SANDBOX makes a missing Docker a failure instead of a skip.
  verifier-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: EXPLORER_NODE_IMAGE BUSYBOX_IMAGE
      - name: Run the verifier's tests with the sandbox
        run: |
          set -a; . ./PINS; set +a
          # The sandbox image is on the runner under the pinned name, and the tests read the same name from PINS.
          docker image inspect --format '{{.Id}}' "$BUSYBOX_IMAGE"
          SHARED="$RUNNER_TEMP/verifier-tmp"
          mkdir -p "$SHARED/bin"
          curl -fsSL -A "Rome Protocol rome@romeprotocol.com" -o "$SHARED/docker.tgz" "https://download.docker.com/linux/static/stable/x86_64/docker-$DOCKER_CLI_VERSION.tgz"
          echo "$DOCKER_CLI_SHA256  $SHARED/docker.tgz" | sha256sum -c -
          tar -xzf "$SHARED/docker.tgz" -C "$SHARED/bin" --strip-components=1 docker/docker
          docker run --rm --user "$(id -u):$(id -g)" --group-add "$(stat -c %g /var/run/docker.sock)" -e HOME=/tmp \
            -e EXPLORER_TEST_REQUIRE_SANDBOX=1 -e TMPDIR="$SHARED" -v "$SHARED:$SHARED" \
            -v /var/run/docker.sock:/var/run/docker.sock -v "$SHARED/bin/docker:/usr/local/bin/docker:ro" \
            -v "$PWD:/repo" -w /repo/explorer "$EXPLORER_NODE_IMAGE" \
            sh -c "npm ci --ignore-scripts && npx vitest run server/verifier"
      - name: Remove what the run made
        if: always()
        run: rm -rf "$RUNNER_TEMP/verifier-tmp"

  # The Ledger API calls, against the OpenAPI document that the pinned Canton writes itself: the requests the explorer sends must be
  # fields that document names, and the fake Ledger API's answers must have its shape. Starts Canton's participants; no bootstrap, no GPU.
  ledger-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: EXPLORER_NODE_IMAGE
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - run: shellcheck explorer/*.sh
      - name: Save the pinned Canton's OpenAPI document
        run: explorer/check-ledger-api.sh "$RUNNER_TEMP/openapi.json"
      - name: Check the explorer's calls against it
        run: |
          set -a; . ./PINS; set +a
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e CANTON_OPENAPI=/openapi.json -v "$RUNNER_TEMP/openapi.json:/openapi.json:ro" -v "$PWD:/repo" -w /repo/explorer "$EXPLORER_NODE_IMAGE" \
            sh -c "npm ci --ignore-scripts && npx vitest run server/ledger.openapi.test.ts"

  # The Verify button's check: the sidecar's own `verify`, built for WebAssembly by explorer/verify/. It runs when the sidecar,
  # the verifier or the trie checker changes, because the module is built from them. The Rust tests check that the module's
  # export answers as the sidecar does; then the built file is loaded in Node through the page's own loader and asked the same.
  verify-wasm:
    runs-on: ubuntu-latest
    env:
      WASM: explorer/verify/target/wasm32-unknown-unknown/release/zk_explorer_verify.wasm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: EXPLORER_NODE_IMAGE
      - run: rustup target add wasm32-unknown-unknown
      # The module is built with explorer/verify/Cargo.lock, the confirmers' sidecar with sidecar/Cargo.lock. A crate in both must be at the same version.
      - run: shellcheck explorer/verify/check-lock-versions.sh explorer/verify/build.sh
      - run: explorer/verify/check-lock-versions.sh
      - run: cargo fmt --check --manifest-path explorer/verify/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path explorer/verify/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path explorer/verify/Cargo.toml
      - name: Build for WebAssembly, into the folder the explorer serves it from
        run: explorer/verify/build.sh
      - name: Run the loader's and the block page's tests on the built file, and check the pages' build serves it
        run: |
          set -a; . ./PINS; set +a
          ls -l "$WASM"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e VERIFY_WASM="/repo/$WASM" -v "$PWD:/repo" -w /repo/explorer "$EXPLORER_NODE_IMAGE" \
            sh -c "npm ci --ignore-scripts && npx vitest run src/verify src/pages/block.test.tsx && npm run build && cmp dist/verify/zk_explorer_verify.wasm verify/target/wasm32-unknown-unknown/release/zk_explorer_verify.wasm"

  # The explorer's database: the migrations and the partition maintenance, against the PostgreSQL that PINS pins (the same image
  # network/explorer-db.sh runs). The tests make a database of their own for each case. EXPLORER_TEST_REQUIRE_DATABASE makes a
  # missing database a failure instead of a skip. The tracker's and the faucet's own tests run again with the database in the files' place
  # (EXPLORER_TEST_STORE=database), and storage.test.ts has the two-instance and import cases. The command line is run twice, to see that the second run changes nothing.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: EXPLORER_NODE_IMAGE POSTGRES_IMAGE
      - name: Start the pinned PostgreSQL, on this machine's loopback only
        run: |
          set -a; . ./PINS; set +a
          # A password made for this run only, never written in the repository; later steps read it from the job's environment.
          PGPW=$(openssl rand -hex 16)
          echo "::add-mask::$PGPW"
          echo "PGPW=$PGPW" >> "$GITHUB_ENV"
          docker run -d --name explorer-db --security-opt no-new-privileges -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=explorer -e POSTGRES_PASSWORD="$PGPW" -e POSTGRES_DB=explorer "$POSTGRES_IMAGE"
          ok=0
          for _ in $(seq 1 60); do
            if docker exec explorer-db pg_isready -U explorer -q; then ok=$((ok + 1)); [ "$ok" -ge 3 ] && break; else ok=0; fi
            sleep 1
          done
          [ "$ok" -ge 3 ] || { docker logs explorer-db; exit 1; }
      - name: Run the database tests and the migration command, twice
        run: |
          set -a; . ./PINS; set +a
          docker run --rm --network host --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e EXPLORER_TEST_REQUIRE_DATABASE=1 -e EXPLORER_TEST_DATABASE_URL=postgres://explorer:$PGPW@127.0.0.1:5432/explorer \
            -e EXPLORER_DATABASE_URL=postgres://explorer:$PGPW@127.0.0.1:5432/explorer \
            -v "$PWD:/repo" -w /repo/explorer "$EXPLORER_NODE_IMAGE" \
            sh -c "npm ci --ignore-scripts && npx vitest run server/db server/indexer server/storage.test.ts server/store-races.test.ts server/api.test.ts server/api-indexed.test.ts && EXPLORER_TEST_STORE=database npx vitest run server/tracker.test.ts server/faucet.test.ts && node server/db/cli.ts migrate && node server/db/cli.ts migrate | grep 'no new migrations'"
      # The image keeps its data in an anonymous volume; -v removes it with the container, so a runner that outlives the job keeps nothing.
      - name: Remove the PostgreSQL and its volume
        if: always()
        run: docker rm -f -v explorer-db
