name: explorer

on:
  pull_request:
    paths: [".github/actions/pinned-images/**", "explorer/**", "network/canton/**", "tests/fake_sidecar.py", "sidecar/**", "verifier/**", "mpt/**", "prover/fixtures/**", "rust-toolchain.toml", "PINS", "tests/FOUNDRY", ".github/workflows/explorer.yml"]
  push:
    branches: [main]
    paths: [".github/actions/pinned-images/**", "explorer/**", "network/canton/**", "tests/fake_sidecar.py", "sidecar/**", "verifier/**", "mpt/**", "prover/fixtures/**", "rust-toolchain.toml", "PINS", "tests/FOUNDRY", ".github/workflows/explorer.yml"]

  # L2 at another size, by hand: the design's size is 10000000 and 600, which takes about 50 minutes and 13 GB of disk (docs/METRICS.md has the run).
  workflow_dispatch:
    inputs:
      l2_transactions: { description: "L2: transactions in the seeded database", default: "3000000" }
      l2_seconds: { description: "L2: seconds of load", default: "120" }

permissions:
  contents: read

jobs:
  # Fakes only: a fake reth and a fake Ledger API. No Docker network, Canton or GPU. The tests run in the pinned Node image, and the pages must build.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: EXPLORER_NODE_IMAGE
      - name: Type-check and run the tests, from the lockfile
        run: |
          set -a; . ./PINS; set +a
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo" -w /repo/explorer "$EXPLORER_NODE_IMAGE" \
            sh -c "npm ci --ignore-scripts && npm run typecheck && npm test && npm run build"

  # The verifier's sandbox, for real: a compile runs in a container of the pinned image (SOLC_SANDBOX_IMAGE, Debian slim: the official compilers need glibc's shared libraries) with no network, a read-only filesystem,
  # a memory limit and a time limit, and the tests check each of them. The tests run in the pinned Node image, which talks to the runner's own
  # Docker through its socket (the Docker program is the static build that PINS pins, checked against its SHA-256 and mounted in). The compilers the tests make sit in a folder that the container
  # and the daemon see at the same path. EXPLORER_TEST_REQUIRE_SANDBOX makes a missing Docker a failure instead of a skip.
  verifier-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: EXPLORER_NODE_IMAGE SOLC_SANDBOX_IMAGE POSTGRES_IMAGE SOLC_IMAGE
      - name: Start the pinned PostgreSQL, on this machine's loopback only
        run: |
          set -a; . ./PINS; set +a
          PGPW=$(openssl rand -hex 16)
          echo "::add-mask::$PGPW"
          echo "PGPW=$PGPW" >> "$GITHUB_ENV"
          docker run -d --name explorer-verifier-db --security-opt no-new-privileges -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=explorer -e POSTGRES_PASSWORD="$PGPW" -e POSTGRES_DB=explorer "$POSTGRES_IMAGE"
          ok=0
          for _ in $(seq 1 60); do
            if docker exec explorer-verifier-db pg_isready -U explorer -q; then ok=$((ok + 1)); [ "$ok" -ge 3 ] && break; else ok=0; fi
            sleep 1
          done
          [ "$ok" -ge 3 ] || { docker logs explorer-verifier-db; exit 1; }
      - name: Run the verifier's tests with the sandbox
        run: |
          set -a; . ./PINS; set +a
          # The sandbox image is on the runner under the pinned name, and the tests read the same name from PINS.
          docker image inspect --format '{{.Id}}' "$SOLC_SANDBOX_IMAGE"
          SHARED="$RUNNER_TEMP/verifier-tmp"
          mkdir -p "$SHARED/bin"
          curl -fsSL -A "Rome Protocol rome@romeprotocol.com" -o "$SHARED/docker.tgz" "https://download.docker.com/linux/static/stable/x86_64/docker-$DOCKER_CLI_VERSION.tgz"
          echo "$DOCKER_CLI_SHA256  $SHARED/docker.tgz" | sha256sum -c -
          tar -xzf "$SHARED/docker.tgz" -C "$SHARED/bin" --strip-components=1 docker/docker
          # server/verifier/real-list.test.ts (EXPLORER_TEST_REAL_LIST=1) downloads the official compiler from the real list and runs it in the sandbox image.
          # The compiler the verification test serves is the static solc of the pinned image (PINS' SOLC_VERSION), copied out of it.
          mkdir -p "$SHARED/solc"
          docker create --name explorer-verifier-solc "$SOLC_IMAGE" > /dev/null
          docker cp explorer-verifier-solc:/usr/bin/solc "$SHARED/solc/solc"
          docker rm explorer-verifier-solc > /dev/null
          # The client checks (explorer/server/rest/etherscan-contract-tools.test.ts) run Foundry's forge and cast: the release that tests/FOUNDRY pins, its alpine build (the
          # Node image is alpine), checked against its SHA-256. Hardhat is installed from its own lockfile (explorer/clients/hardhat) in the same container.
          . ./tests/FOUNDRY
          mkdir -p "$SHARED/foundry"
          curl -fsSL -A "Rome Protocol rome@romeprotocol.com" -o "$SHARED/foundry.tgz" "https://github.com/foundry-rs/foundry/releases/download/$FOUNDRY_VERSION/foundry_${FOUNDRY_VERSION}_alpine_amd64.tar.gz"
          echo "$FOUNDRY_ALPINE_AMD64_SHA256  $SHARED/foundry.tgz" | sha256sum -c -
          tar -xzf "$SHARED/foundry.tgz" -C "$SHARED/foundry" forge cast
          docker run --rm --user "$(id -u):$(id -g)" --group-add "$(stat -c %g /var/run/docker.sock)" -e HOME=/tmp \
            --network host -e EXPLORER_TEST_REQUIRE_SANDBOX=1 -e EXPLORER_TEST_REAL_LIST=1 -e EXPLORER_TEST_REQUIRE_DATABASE=1 -e EXPLORER_TEST_SOLC="$SHARED/solc/solc" \
            -e EXPLORER_TEST_FORGE="$SHARED/foundry/forge" -e EXPLORER_TEST_CAST="$SHARED/foundry/cast" -e EXPLORER_TEST_REQUIRE_CLIENTS=1 \
            -e EXPLORER_TEST_DATABASE_URL=postgres://explorer:$PGPW@127.0.0.1:5432/explorer -e TMPDIR="$SHARED" -v "$SHARED:$SHARED" \
            -v /var/run/docker.sock:/var/run/docker.sock -v "$SHARED/bin/docker:/usr/local/bin/docker:ro" \
            -v "$PWD:/repo" -w /repo/explorer "$EXPLORER_NODE_IMAGE" \
            sh -c "npm ci --ignore-scripts && (cd clients/hardhat && npm ci --ignore-scripts) && npx vitest run server/verifier server/rest/etherscan-contract-tools.test.ts"
      - name: Remove what the run made
        if: always()
        run: |
          docker rm -f -v explorer-verifier-db explorer-verifier-solc > /dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/verifier-tmp"

  # The Ledger API calls, against the OpenAPI document that the pinned Canton writes itself: the requests the explorer sends must be
  # fields that document names, and the fake Ledger API's answers must have its shape. Starts Canton's participants; no bootstrap, no GPU.
  ledger-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: EXPLORER_NODE_IMAGE
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - run: shellcheck explorer/*.sh
      - name: Save the pinned Canton's OpenAPI document
        run: explorer/check-ledger-api.sh "$RUNNER_TEMP/openapi.json"
      - name: Check the explorer's calls against it
        run: |
          set -a; . ./PINS; set +a
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e CANTON_OPENAPI=/openapi.json -v "$RUNNER_TEMP/openapi.json:/openapi.json:ro" -v "$PWD:/repo" -w /repo/explorer "$EXPLORER_NODE_IMAGE" \
            sh -c "npm ci --ignore-scripts && npx vitest run server/ledger.openapi.test.ts"

  # The Verify button's check: the sidecar's own `verify`, built for WebAssembly by explorer/verify/. It runs when the sidecar,
  # the verifier or the trie checker changes, because the module is built from them. The Rust tests check that the module's
  # export answers as the sidecar does; then the built file is loaded in Node through the page's own loader and asked the same.
  verify-wasm:
    runs-on: ubuntu-latest
    env:
      WASM: explorer/verify/target/wasm32-unknown-unknown/release/zk_explorer_verify.wasm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: EXPLORER_NODE_IMAGE
      - run: rustup target add wasm32-unknown-unknown
      # The module is built with explorer/verify/Cargo.lock, the confirmers' sidecar with sidecar/Cargo.lock. A crate in both must be at the same version.
      - run: shellcheck explorer/verify/check-lock-versions.sh explorer/verify/build.sh
      - run: explorer/verify/check-lock-versions.sh
      - run: cargo fmt --check --manifest-path explorer/verify/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path explorer/verify/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path explorer/verify/Cargo.toml
      - name: Build for WebAssembly, into the folder the explorer serves it from
        run: explorer/verify/build.sh
      - name: Run the loader's and the block page's tests on the built file, and check the pages' build serves it
        run: |
          set -a; . ./PINS; set +a
          ls -l "$WASM"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e VERIFY_WASM="/repo/$WASM" -v "$PWD:/repo" -w /repo/explorer "$EXPLORER_NODE_IMAGE" \
            sh -c "npm ci --ignore-scripts && npx vitest run src/verify src/pages/block.test.tsx && npm run build && cmp dist/verify/zk_explorer_verify.wasm verify/target/wasm32-unknown-unknown/release/zk_explorer_verify.wasm"

  # The explorer's database: the migrations, the partition maintenance and every server test, against the PostgreSQL that PINS pins (the same image
  # network/explorer-db.sh runs). The tests make a database of their own for each case. EXPLORER_TEST_REQUIRE_DATABASE makes a
  # missing database a failure instead of a skip. The tracker's and the faucet's own tests run again with the database in the files' place
  # (EXPLORER_TEST_STORE=database), and storage.test.ts has the two-instance and import cases. The command line is run twice, to see that the second run changes nothing.
  # The two files that need the verifier's sandbox are the verifier-sandbox job's; server/db-ci-coverage.test.ts fails when a file that reads the database is in neither job.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: EXPLORER_NODE_IMAGE POSTGRES_IMAGE
      - name: Start the pinned PostgreSQL, on this machine's loopback only
        run: |
          set -a; . ./PINS; set +a
          # A password made for this run only, never written in the repository; later steps read it from the job's environment.
          PGPW=$(openssl rand -hex 16)
          echo "::add-mask::$PGPW"
          echo "PGPW=$PGPW" >> "$GITHUB_ENV"
          docker run -d --name explorer-db --security-opt no-new-privileges -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=explorer -e POSTGRES_PASSWORD="$PGPW" -e POSTGRES_DB=explorer "$POSTGRES_IMAGE"
          ok=0
          for _ in $(seq 1 60); do
            if docker exec explorer-db pg_isready -U explorer -q; then ok=$((ok + 1)); [ "$ok" -ge 3 ] && break; else ok=0; fi
            sleep 1
          done
          [ "$ok" -ge 3 ] || { docker logs explorer-db; exit 1; }
      - name: Run the database tests and the migration command, twice
        run: |
          set -a; . ./PINS; set +a
          docker run --rm --network host --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e EXPLORER_TEST_REQUIRE_DATABASE=1 -e EXPLORER_TEST_DATABASE_URL=postgres://explorer:$PGPW@127.0.0.1:5432/explorer \
            -e EXPLORER_DATABASE_URL=postgres://explorer:$PGPW@127.0.0.1:5432/explorer \
            -v "$PWD:/repo" -w /repo/explorer "$EXPLORER_NODE_IMAGE" \
            sh -c "npm ci --ignore-scripts && npx vitest run server --exclude 'server/verifier/**' --exclude server/rest/etherscan-contract-tools.test.ts && EXPLORER_TEST_STORE=database npx vitest run server/tracker.test.ts server/faucet.test.ts && node server/db/cli.ts migrate && node server/db/cli.ts migrate | grep 'no new migrations'"
      # The image keeps its data in an anonymous volume; -v removes it with the container, so a runner that outlives the job keeps nothing.
      - name: Remove the PostgreSQL and its volume
        if: always()
        run: docker rm -f -v explorer-db

  # L2 (design section 9): the API at scale. A database seeded through the indexer's own write path, then two minutes of the mixed load of the design while ingestion
  # keeps writing blocks and live-stream clients stay open, held to B3, B4, B6 and B7. The design's size (10,000,000 transactions, 600 s) is for the reference machine;
  # this is the scaled run (3,000,000 transactions, with the one address at its million), and docs/METRICS.md says what it measured. The numbers are in the l2-results artifact.
  l2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      L2_TRANSACTIONS: ${{ inputs.l2_transactions || '3000000' }}
      L2_SECONDS: ${{ inputs.l2_seconds || '120' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: EXPLORER_NODE_IMAGE POSTGRES_IMAGE
      - name: Start the pinned PostgreSQL, on this machine's loopback only
        run: |
          set -a; . ./PINS; set +a
          PGPW=$(openssl rand -hex 16)
          echo "::add-mask::$PGPW"
          echo "PGPW=$PGPW" >> "$GITHUB_ENV"
          # --shm-size: the container's default 64 MB of shared memory is too small for the vacuum of a table of millions of rows, and for shared_buffers.
          # shared_buffers and effective_cache_size are set as a database of this size would have them (the image's defaults are for a toy), and the runner has 16 GB.
          docker run -d --name explorer-l2-db --security-opt no-new-privileges --shm-size=2g -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=explorer -e POSTGRES_PASSWORD="$PGPW" -e POSTGRES_DB=explorer "$POSTGRES_IMAGE" \
            -c max_connections=200 -c shared_buffers=1GB -c effective_cache_size=6GB
          ok=0
          for _ in $(seq 1 60); do
            if docker exec explorer-l2-db pg_isready -U explorer -q; then ok=$((ok + 1)); [ "$ok" -ge 3 ] && break; else ok=0; fi
            sleep 1
          done
          [ "$ok" -ge 3 ] || { docker logs explorer-l2-db; exit 1; }
      - name: Disk before L2
        run: df -h / /var/lib/docker /mnt 2>/dev/null || true
      - name: Run L2
        run: |
          set -a; . ./PINS; set +a
          docker run --rm --network host --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e EXPLORER_TEST_REQUIRE_DATABASE=1 -e EXPLORER_TEST_DATABASE_URL=postgres://explorer:$PGPW@127.0.0.1:5432/explorer \
            -e L2=1 -e L2_TRANSACTIONS -e L2_SECONDS -e L2_SSE=2000 -e L2_RESULTS=/repo/explorer/l2-results.json \
            -v "$PWD:/repo" -w /repo/explorer "$EXPLORER_NODE_IMAGE" \
            sh -c "npm ci --ignore-scripts && npx vitest run test/l2 --maxWorkers=2"
      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: l2-results
          path: explorer/l2-results.json
          if-no-files-found: warn
      - name: Remove the PostgreSQL and its volume
        if: always()
        run: docker rm -f -v explorer-l2-db
