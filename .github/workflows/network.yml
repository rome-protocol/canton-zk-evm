name: network

on:
  pull_request:
    paths: [".github/actions/pinned-images/**", "network/**", "daml/**", "tests/**", "PINS", "demo/canton.py", "demo/requirements.txt", "demo/results/**", "prover/fixtures/**", "prover/make-block.py", "builder/keccak.py", "builder/builder.py", "builder/requirements.txt", "gateway/Gateway.bin-runtime", "gateway/Vault.bin-runtime", "sidecar/tests/fixtures/block.json", ".github/workflows/network.yml"]
  push:
    branches: [main]
    paths: [".github/actions/pinned-images/**", "network/**", "daml/**", "tests/**", "PINS", "demo/canton.py", "demo/requirements.txt", "demo/results/**", "prover/fixtures/**", "prover/make-block.py", "builder/keccak.py", "builder/builder.py", "builder/requirements.txt", "gateway/Gateway.bin-runtime", "gateway/Vault.bin-runtime", "sidecar/tests/fixtures/block.json", ".github/workflows/network.yml"]

permissions:
  contents: read

jobs:
  # The pins and the scripts' own checks: no Canton, no Docker.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: tests/network_static.sh
      - run: tests/network_checks.sh
      - name: The stop and restart scripts of the persistent network, against a fake Docker
        run: tests/persist_scripts.sh
      - name: The proposal script, against a fake Ledger API
        run: python3 -m unittest discover -s tests -p 'test_propose.py' -v
      - name: Setting Ostia up on an existing participant, against a fake participant
        run: python3 -m unittest discover -s tests -p 'test_external_setup.py' -v
      - name: Moving reth to Canton's head after a restart, against a fake reth
        run: python3 -m unittest discover -s tests -p 'test_sync_reth.py' -v
      - name: Rebuilding reth from Canton's block records, against a fake Ledger API and a fake reth
        run: python3 -m unittest discover -s tests -p 'test_replay_from_canton.py' -v

  # The Canton side for real: the pinned released Canton and Daml compiler (PINS), the real form of the Daml package,
  # the config and bootstrap, the chain proposal, and one Advance, against a stand-in for the sidecars.
  canton:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Canton, the real Daml package and one Advance
        run: tests/canton_network.sh

  # Ostia on an existing participant, for real: the same pinned Canton, started without Ostia's bootstrap and with a login on its Ledger API;
  # network/external/setup.py twice (the second changes nothing), the users' rights, and one Advance against one stand-in sidecar.
  canton-external:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Ostia on an existing participant
        run: tests/canton_external.sh

  # What Canton's rejection says when one participant stops answering, on the pinned Canton: the mediator's timeout names the unresponsive parties,
  # in the JSON API's answer and in the command's completion, and the builder's readers find them (tests/canton_timeout.sh; a probe package, not Ostia's).
  canton-timeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the builder's one dependency, by hash
        run: |
          python3 --version | grep -q '^Python 3\.12\.'
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r builder/requirements.txt
      - name: One participant stops answering
        run: PYTHON="$RUNNER_TEMP/venv/bin/python" tests/canton_timeout.sh

  # The persistent network for real: Canton in PostgreSQL (the pinned image), one Advance, then Canton killed and the database stopped
  # as a reboot would, and both started again the way network/restart.sh does. The chain must be the same contract at the same head.
  canton-persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: POSTGRES_IMAGE
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: The chain survives a crash of Canton and a stop of the database
        run: tests/canton_persist.sh

  # The standard contracts script: against a stand-in node, and against a real reth started only through network/reth/launch.sh (peer discovery off):
  # the first run deploys the CREATE2 deployer, Multicall3, CreateX and Permit2 with the canonical code, the second sends nothing.
  standard-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: RETH_IMAGE BUSYBOX_IMAGE
      - name: Install the packages, by hash
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r demo/requirements.txt
      - name: The script against a stand-in node
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -p ''test_standard_contracts.py'' -v'
      - name: The script against a real reth
        run: PYTHON="$RUNNER_TEMP/venv/bin/python" tests/standard_contracts.sh
