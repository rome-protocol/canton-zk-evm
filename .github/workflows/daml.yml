name: daml

on:
  pull_request:
    paths: ["daml/**", "network/canton/build-dar.sh", "network/canton/fetch.sh", "network/canton/dar-id.sh", "PINS", ".github/workflows/daml.yml"]
  push:
    branches: [main]
    paths: ["daml/**", "network/canton/build-dar.sh", "network/canton/fetch.sh", "network/canton/dar-id.sh", "PINS", ".github/workflows/daml.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: The token-standard packages match their pinned hashes
        run: cd daml/dars && sha256sum -c SHA256SUMS
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dpm and the pinned Daml SDK
        env:
          # SDK 3.5.12 (the sdk-version in daml.yaml): the publisher's SHA256 for dpm-3.5.12-linux-amd64.tar.gz, as its package registry lists it.
          SDK_SHA256: af3cb2f3e3a2f99e8733f618383f7f7c2bf58fa63417911c7f73c34fe69b7b63
        run: |
          version=$(sed -n 's/^sdk-version: *//p' daml/daml.yaml)
          bundle="dpm-${version}-linux-amd64.tar.gz"
          curl -SLf --retry 3 -o "$RUNNER_TEMP/$bundle" "https://artifactregistry.googleapis.com/download/v1/projects/da-images/locations/europe/repositories/public-generic/files/dpm-sdk:${version}:${bundle}:download?alt=media"
          echo "$SDK_SHA256  $RUNNER_TEMP/$bundle" | sha256sum -c -
          mkdir "$RUNNER_TEMP/sdk"
          tar xzf "$RUNNER_TEMP/$bundle" -C "$RUNNER_TEMP/sdk" --strip-components 1
          "$RUNNER_TEMP/sdk/bin/dpm" bootstrap "$RUNNER_TEMP/sdk"
          echo "$HOME/.dpm/bin" >> "$GITHUB_PATH"
      - name: Build the DAR and run the Daml Script tests
        run: daml/test.sh

  # 0.2.0 must be a valid upgrade of the live 0.1.0. Both DARs are the external form, built with the toolchain in PINS
  # (the one the network runs), so the old package id is the live one.
  upgrade:
    runs-on: ubuntu-latest
    env:
      LIVE_PACKAGE_ID: ea89dbabb095e49f05b3d23b22916592f6ab65a2f3ad98400c6a68262495bb08
      CZE_TOOLS_DIR: ${{ github.workspace }}/../tools
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the pinned Daml toolchain (every download is checked against PINS)
        run: network/canton/fetch.sh
      - name: Rebuild 0.1.0 from the tag v0.1.0 and check its package id
        run: |
          git fetch --no-tags --depth=1 origin tag v0.1.0
          git worktree add "$RUNNER_TEMP/v0.1.0" v0.1.0
          grep -qx 'version: 0.1.0' "$RUNNER_TEMP/v0.1.0/daml/daml.yaml"
          old=$(cd "$RUNNER_TEMP/v0.1.0" && network/canton/build-dar.sh)
          cp "$old" "$RUNNER_TEMP/old.dar"
          id=$(network/canton/dar-id.sh "$RUNNER_TEMP/old.dar" | sed -n 's/^package_id=//p')
          echo "0.1.0 package id: $id"
          [ "$id" = "$LIVE_PACKAGE_ID" ] || { echo "FAIL: 0.1.0 rebuilt from the tag has package id $id, not $LIVE_PACKAGE_ID" >&2; exit 1; }
      - name: Build this version and run the upgrade check
        run: |
          grep -qx 'version: 0.2.0' daml/daml.yaml
          new=$(network/canton/build-dar.sh)
          cp "$new" "$RUNNER_TEMP/new.dar"
          network/canton/dar-id.sh "$RUNNER_TEMP/new.dar"
          . ./PINS
          export DPM_HOME=$CZE_TOOLS_DIR/dpm DPM_REGISTRY PATH="$CZE_TOOLS_DIR/bin:$PATH"
          dpm upgrade-check --both "$RUNNER_TEMP/old.dar" "$RUNNER_TEMP/new.dar"
