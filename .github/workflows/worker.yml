name: worker

on:
  pull_request:
    paths: ["worker/**", "tests/test_worker.py", "demo/canton.py", "demo/requirements.txt", "router/src/CantonRouter.sol", "router/test/vectors/**", "network/canton/propose.py", ".github/workflows/worker.yml"]
  push:
    branches: [main]
    paths: ["worker/**", "tests/test_worker.py", "demo/canton.py", "demo/requirements.txt", "router/src/CantonRouter.sol", "router/test/vectors/**", "network/canton/propose.py", ".github/workflows/worker.yml"]

permissions:
  contents: read

jobs:
  # The Canton router's worker (flow A) against stand-ins only: a fake chain, a fake ledger snapshot and a local stand-in for the bridge service. No real endpoint.
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install the packages, by hash
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r demo/requirements.txt
      - run: '"$RUNNER_TEMP/venv/bin/python" -W error::ResourceWarning -m unittest tests/test_worker.py -v'
