name: router

on:
  pull_request:
    paths: [".github/actions/pinned-images/**", "router/**", "gateway/Gateway.sol", "PINS", "tests/FOUNDRY", ".github/workflows/router.yml"]
  push:
    branches: [main]
    paths: [".github/actions/pinned-images/**", "router/**", "gateway/Gateway.sol", "PINS", "tests/FOUNDRY", ".github/workflows/router.yml"]

permissions:
  contents: read

jobs:
  # The Canton router's contracts, tested with the pinned Foundry (tests/FOUNDRY), the pinned solc (PINS) and forge-std at a pinned commit (router/TOOLS):
  # every flow, every refusal, the refund rules, the proxies and the upgrade test, and the inbox's checked-in bytes against their pinned hash.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: SOLC_IMAGE
      - run: router/run.sh

  # The deploy script against a local chain (anvil, from the pinned Foundry): the deploy, the settings through the timelock and every read-back.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: SOLC_IMAGE
      - run: router/deploy-test.sh

  # The upgrade rules of the design's section 3.7: OpenZeppelin's upgrade-safety check against the deployed build's checked-in output, and the inbox's hash.
  upgrade-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/pinned-images
        with:
          images: SOLC_IMAGE
      - run: router/upgrade-check.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: shellcheck router/*.sh
