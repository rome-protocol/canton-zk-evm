# The OTC app: a seller's offer and the trade a venue makes of it. It depends only on the Canton token standard (CIP-0056)
# packages, which are in ../../daml/dars; it does not depend on the canton-zk-evm package. Build it with build.sh.
sdk-version: 3.5.12
name: otc-venue
version: 0.1.0
source: src
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  - __DARS__/splice-api-token-metadata-v1-1.0.0.dar
  - __DARS__/splice-api-token-holding-v1-1.0.0.dar
  - __DARS__/splice-api-token-allocation-v1-1.0.0.dar
  - __DARS__/splice-api-token-allocation-request-v1-1.0.0.dar
build-options:
  - --target=2.1
