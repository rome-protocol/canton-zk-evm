// One Canton network on one machine: one synchronizer and three participants, all in memory.
//   operator    hosts the operator and the builder; runs a sidecar (8085)
//   confirmer   hosts the confirmer; runs a sidecar (8086)
//   users       hosts U, V, the test token's registry and the reader; no sidecar
// "canton-zk-evm" is the extension the Daml package calls (DA.ExternalCall). Each confirming participant
// sends it to its own sidecar; the users participant has none and so never runs it.
// Everything listens on localhost only. There is no persistent state: a restart is a new network.
canton {
  sequencers.sequencer1 {
    storage.type = memory
    public-api { address = "127.0.0.1", port = 5001 }
    admin-api { address = "127.0.0.1", port = 5002 }
    sequencer.type = BFT
  }

  mediators.mediator1 {
    storage.type = memory
    admin-api { address = "127.0.0.1", port = 5202 }
  }

  participants {
    operator {
      storage.type = memory
      admin-api { address = "127.0.0.1", port = 5012 }
      ledger-api { address = "127.0.0.1", port = 5011 }
      http-ledger-api { address = "127.0.0.1", port = 7575 }
      parameters.engine.extensions.canton-zk-evm {
        address = "127.0.0.1"
        port = 8085
        validate-on-startup = true
      }
    }
    confirmer {
      storage.type = memory
      admin-api { address = "127.0.0.1", port = 5022 }
      ledger-api { address = "127.0.0.1", port = 5021 }
      http-ledger-api { address = "127.0.0.1", port = 7576 }
      parameters.engine.extensions.canton-zk-evm {
        address = "127.0.0.1"
        port = 8086
        validate-on-startup = true
      }
    }
    users {
      storage.type = memory
      admin-api { address = "127.0.0.1", port = 5032 }
      ledger-api { address = "127.0.0.1", port = 5031 }
      http-ledger-api { address = "127.0.0.1", port = 7577 }
    }
  }
}
