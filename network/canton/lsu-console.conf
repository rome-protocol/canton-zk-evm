// The console that runs network/canton/lsu.canton: it reaches the running nodes of canton.conf and lsu.conf over their admin APIs,
// as an operator's console would. Exporting a node's keys is a preview command, so preview commands are on.
canton {
  features.enable-preview-commands = yes

  remote-sequencers {
    sequencer1 {
      public-api { address = "127.0.0.1", port = 5001 }
      admin-api { address = "127.0.0.1", port = 5002 }
    }
    sequencer2 {
      public-api { address = "127.0.0.1", port = 5041 }
      admin-api { address = "127.0.0.1", port = 5042 }
    }
  }

  remote-mediators {
    mediator1.admin-api { address = "127.0.0.1", port = 5202 }
    mediator2.admin-api { address = "127.0.0.1", port = 5212 }
  }

  remote-participants {
    operator {
      admin-api { address = "127.0.0.1", port = 5012 }
      ledger-api { address = "127.0.0.1", port = 5011 }
    }
    confirmer {
      admin-api { address = "127.0.0.1", port = 5022 }
      ledger-api { address = "127.0.0.1", port = 5021 }
    }
    users {
      admin-api { address = "127.0.0.1", port = 5032 }
      ledger-api { address = "127.0.0.1", port = 5031 }
    }
  }
}
