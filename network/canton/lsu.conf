// Added to canton.conf (a second -c) by tests/canton_lsu.sh: the nodes of the successor synchronizer for a logical synchronizer upgrade.
// sequencer2 and mediator2 start with no identity and wait. At the upgrade, network/canton/lsu.canton gives them the identity and keys of
// sequencer1 and mediator1 and the synchronizer's topology state, on the successor's protocol version. bootstrap.synchronizer_local() in
// bootstrap.canton leaves them out, because they have no identity when it runs, so the network starts as it always does.
// Ports on localhost only, next to the ones canton.conf uses.
canton {
  // The console in lsu.canton reaches the nodes over their admin APIs, and a node gives out a private key over its admin API only with this
  // on. It is for this local test network only; Canton says not to turn it on in production.
  parameters.enable-key-download = yes

  sequencers.sequencer2 {
    storage.type = memory
    public-api { address = "127.0.0.1", port = 5041 }
    admin-api { address = "127.0.0.1", port = 5042 }
    sequencer.type = BFT
    init.identity.type = manual
    init.generate-topology-transactions-and-keys = false
  }

  mediators.mediator2 {
    storage.type = memory
    admin-api { address = "127.0.0.1", port = 5212 }
    init.identity.type = manual
    init.generate-topology-transactions-and-keys = false
  }
}
