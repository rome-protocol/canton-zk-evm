// Added to canton.conf (a second -c) when CZE_PERSIST=1: every node keeps its data in PostgreSQL instead of in memory, so the
// chain, its blocks and every holding come back after a restart. One database per node, all on the one server that
// network/postgres.sh runs on 127.0.0.1. The password is not here: network/canton/run.sh passes it in CZE_PG_PASSWORD, read from a
// file on the machine (mode 0600). The user and the port are the ones postgres.sh makes (CZE_PG_PORT overrides the port).
_pg {
  type = postgres
  config {
    dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
    properties {
      serverName = "127.0.0.1"
      portNumber = "5432"
      portNumber = ${?CZE_PG_PORT}
      user = "cze"
      password = ${CZE_PG_PASSWORD}
    }
  }
}

canton {
  sequencers.sequencer1.storage = ${_pg}
  sequencers.sequencer1.storage.config.properties.databaseName = "sequencer1"
  mediators.mediator1.storage = ${_pg}
  mediators.mediator1.storage.config.properties.databaseName = "mediator1"
  participants.operator.storage = ${_pg}
  participants.operator.storage.config.properties.databaseName = "operator"
  participants.confirmer.storage = ${_pg}
  participants.confirmer.storage.config.properties.databaseName = "confirmer"
  participants.users.storage = ${_pg}
  participants.users.storage.config.properties.databaseName = "users"
}
