[package]
name = "zk-sidecar"
description = "The service Canton calls through its external-call extension: checks a proven block, and how far a balance rose in it."
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
publish = false

[features]
# Lets the tests replace the proof check (`Config::with_proof_check`). It is switched on by the
# dev-dependency below, so the program is built without it.
test-proof-check = []

[dependencies]
zk-verifier = { path = "../verifier" }
zk-mpt = { path = "../mpt" }
sha3 = "0.10"
tiny_http = "0.12"

[dev-dependencies]
zk-sidecar = { path = ".", features = ["test-proof-check"] }
serde_json = "1"
# An independent way to compute the transactions root, to check ours against.
triehash = "0.8"
keccak-hasher = "0.15"
