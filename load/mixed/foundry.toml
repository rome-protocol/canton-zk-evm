[profile.default]
src = "contracts"
test = "none"
libs = []
out = "out"
cache_path = "cache"
auto_detect_solc = true
# solc 0.8.17 has no paris, so forge builds the kit contracts for london; the Uniswap V2 core (solc 0.5.16) falls back to istanbul; Merces is built by its own project (osaka).
# "paris" is kept because the deployed Uniswap pair code (and so the router's pair hash) comes from exactly this setting.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# The metadata hash stays in the code (Foundry's default). The explorer needs it for a full match: without it a contract can only ever be a partial one.
# The Uniswap pair is solc 0.5.16, which always carries its own hash, so its code, and the pair hash the router relies on, do not change; scripts/prepare.mjs check shows the pair code is the same in the two passes of a build.
bytecode_hash = "ipfs"
cbor_metadata = true
allow_paths = ["node_modules", "gen"]
extra_output_files = ["metadata"]
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
  "@erc3643org/erc-3643/=node_modules/@erc3643org/erc-3643/",
  "@onchain-id/solidity/=node_modules/@onchain-id/solidity/",
  "@uniswap/v2-core/=node_modules/@uniswap/v2-core/",
  "@uniswap/lib/=node_modules/@uniswap/lib/",
  "@redstone-finance/evm-connector/=node_modules/@redstone-finance/evm-connector/",
]

