[profile.default]
src = "contracts"
test = "none"
libs = []
out = "out"
cache_path = "cache"
auto_detect_solc = true
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# No metadata hash: the same source always gives the same bytes, which the Uniswap pair hash below relies on.
bytecode_hash = "none"
cbor_metadata = false
allow_paths = ["node_modules", "gen"]
extra_output_files = ["metadata"]
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
  "@erc3643org/erc-3643/=node_modules/@erc3643org/erc-3643/",
  "@onchain-id/solidity/=node_modules/@onchain-id/solidity/",
  "@uniswap/v2-core/=node_modules/@uniswap/v2-core/",
  "@uniswap/lib/=node_modules/@uniswap/lib/",
]

