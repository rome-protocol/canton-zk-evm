[package]
name = "zk-mpt"
description = "Checks Ethereum Merkle-Patricia account and storage proofs (eth_getProof) against a state root."
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
publish = false

[dependencies]
sha3 = "0.10"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
