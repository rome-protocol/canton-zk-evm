[package]
name = "zk-verifier"
description = "Checks the wrapped ZisK proof (a PLONK proof over BN254) in plain Rust."
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
# The ZisK 1.2.0 key, for the tests only: it lets them check that a proof from one release is
# refused under the other release's key. It is switched on by the dev-dependency below, so a crate
# that depends on zk-verifier gets only the 1.3.1 key unless it turns this feature on by name.
zisk-1-2-0-test-key = []

[dependencies]
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
sha2 = "0.10"
sha3 = "0.10"

[dev-dependencies]
zk-verifier = { path = ".", features = ["zisk-1-2-0-test-key"] }
hex = "0.4"
serde_json = "1"
